<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Treezip</title>
<script>
(function(){var t;try{t=localStorage.getItem("theme")}catch(e){}
if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.dataset.theme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F3F4FF; --blob1:rgba(108,99,255,.22); --blob2:rgba(45,212,191,.20); --blob3:rgba(255,150,170,.20);
    --surface:#FFFFFF; --sunken:rgba(108,99,255,.08); --ink:#1B1F3B; --muted:#666C8C; --line:rgba(80,80,160,.18);
    --cobalt:#6C63FF; --danger:#C93B3B; --danger-bg:#FDEAEA;
    --shadow:0 1px 2px rgba(40,40,110,.05), 0 28px 60px -24px rgba(76,69,200,.38);
  }
  [data-theme="dark"] {
    --bg:#0C0E1D; --blob1:rgba(108,99,255,.30); --blob2:rgba(23,195,162,.14); --blob3:rgba(255,120,150,.12);
    --surface:#161A35; --sunken:rgba(255,255,255,.06); --ink:#ECEEFF; --muted:#9AA0C3; --line:rgba(255,255,255,.12);
    --cobalt:#8F88FF; --danger:#FF8A8A; --danger-bg:#3A1D24;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 28px 60px -24px rgba(0,0,0,.7);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(640px 460px at 100% 0%, var(--blob1), transparent 70%), radial-gradient(640px 480px at 100% 100%, var(--blob2), transparent 70%), radial-gradient(520px 420px at 55% 50%, var(--blob3), transparent 70%); }
  :focus-visible { outline:2px solid var(--cobalt); outline-offset:2px; }

  .split { min-height:100vh; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); }

  /* brand side */
  .brand { position:relative; overflow:hidden; color:#fff; padding:56px 56px 44px; display:flex; flex-direction:column; justify-content:space-between; gap:32px;
    background:linear-gradient(150deg,#4338CA 0%,#6D4DF2 48%,#1FB0C8 100%); }
  .brand::before { content:""; position:absolute; width:520px; height:520px; right:-180px; top:-200px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.26), transparent 68%); }
  .brand::after { content:""; position:absolute; width:460px; height:460px; left:-160px; bottom:-220px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.16), transparent 70%); }
  .brand > * { position:relative; z-index:1; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; }
  .logo svg { width:32px; height:32px; }
  .brand h1 { font-size:clamp(34px, 4.2vw, 56px); line-height:1.05; letter-spacing:-0.025em; font-weight:700; margin:0 0 16px; max-width:14ch; }
  .brand p { margin:0; color:rgba(255,255,255,.86); max-width:44ch; font-size:16px; }
  .demo { margin:8px 0 0; }
  .demo svg { width:100%; max-width:430px; height:auto; display:block; overflow:visible; }
  .demo figcaption { margin-top:14px; color:rgba(255,255,255,.82); font-size:14px; max-width:46ch; }
  .demo figcaption b { color:#fff; font-weight:600; }
  .t-edge { stroke:rgba(255,255,255,.55); stroke-width:2; fill:none; }
  .t-int { fill:#4338CA; stroke:#fff; stroke-width:2; }
  .t-leaf { fill:#fff; stroke:#fff; stroke-width:2; }
  .t-txt { fill:#fff; font-weight:700; text-anchor:middle; font-family:inherit; }
  .t-leaf ~ .t-txt { fill:#3B34C9; }
  .t-code { font-family:"JetBrains Mono", ui-monospace, Consolas, monospace; font-size:13px; font-weight:600; text-anchor:middle; }
  .t-leaf ~ .t-code { fill:#fff; }
  .e0 { fill:rgba(255,255,255,.85); font-size:12px; font-weight:700; text-anchor:middle; }
  .e1 { fill:#FFE29A; font-size:12px; font-weight:700; text-anchor:middle; }

  /* one orchestrated moment: the tree draws itself */
  .t-edge { stroke-dasharray:160; stroke-dashoffset:160; animation:draw .9s ease forwards; }
  .t-edge.d1 { animation-delay:.15s; } .t-edge.d2 { animation-delay:.45s; } .t-edge.d3 { animation-delay:.75s; }
  .t-node { opacity:0; animation:pop .4s ease forwards; }
  .t-node.d0 { animation-delay:0s; } .t-node.d1 { animation-delay:.4s; } .t-node.d2 { animation-delay:.7s; } .t-node.d3 { animation-delay:1s; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes pop { to { opacity:1; } }

  /* form side */
  .side { display:flex; align-items:center; justify-content:center; padding:40px 24px; position:relative; }
  .theme { position:absolute; top:20px; right:20px; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; display:grid; place-items:center; }
  .theme:hover { border-color:var(--cobalt); }
  .theme svg { width:18px; height:18px; }
  .theme .sun { display:none; } [data-theme="dark"] .theme .sun { display:block; } [data-theme="dark"] .theme .moon { display:none; }
  .panel { width:100%; max-width:430px; background:var(--surface); border:1px solid var(--line); border-radius:28px; padding:36px 34px 34px; box-shadow:var(--shadow); }
  .panel h2 { font-size:28px; letter-spacing:-0.02em; margin:0 0 4px; font-weight:700; }
  .panel .sub { margin:0 0 24px; color:var(--muted); }
  .seg { display:flex; gap:4px; background:var(--sunken); padding:4px; border-radius:999px; margin-bottom:22px; }
  .seg button { flex:1; border:0; background:transparent; color:var(--muted); padding:9px 12px; border-radius:999px; cursor:pointer; font:inherit; font-weight:600; transition:color .15s; }
  .seg button[aria-selected="true"] { background:linear-gradient(135deg,#6C63FF,#4F8BFF); color:#fff; box-shadow:0 6px 16px -6px rgba(88,92,255,.7); }
  label { display:block; font-size:14px; font-weight:600; margin:16px 0 6px; }
  input { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:13px 15px; font:inherit; transition:border-color .15s, box-shadow .15s; }
  input:focus-visible { outline:0; border-color:var(--cobalt); box-shadow:0 0 0 4px color-mix(in srgb, var(--cobalt) 22%, transparent); }
  .hint { color:var(--muted); font-size:13px; margin-top:6px; }
  .pw { position:relative; }
  .pw input { padding-right:68px; }
  .pw button { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted); cursor:pointer; font:inherit; font-size:13px; font-weight:600; padding:6px 10px; border-radius:8px; }
  .pw button:hover { color:var(--ink); }
  .submit { width:100%; margin-top:26px; background:linear-gradient(135deg,#6C63FF,#4F8BFF); color:#fff; border:0; padding:14px; border-radius:14px; font:inherit; font-weight:700; cursor:pointer; box-shadow:0 12px 24px -8px rgba(88,92,255,.75); transition:transform .12s, filter .12s; }
  .submit:hover { filter:brightness(1.07); transform:translateY(-1px); }
  .submit:disabled { opacity:.55; cursor:not-allowed; transform:none; }
  .error { display:none; background:var(--danger-bg); border:1px solid var(--danger); color:var(--danger); padding:10px 14px; border-radius:12px; margin-bottom:6px; font-size:14px; }
  .hidden { display:none; }

  @media (max-width:860px) {
    .split { grid-template-columns:1fr; }
    .brand { padding:28px 24px; gap:16px; }
    .brand h1 { font-size:30px; max-width:none; }
    .demo { display:none; }
    .panel { padding:28px 22px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .t-edge { animation:none; stroke-dashoffset:0; } .t-node { animation:none; opacity:1; }
  }
</style>
</head>
<body>
<div class="split">
  <section class="brand" aria-label="About this tool">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><line x1="16" y1="8" x2="8" y2="22" stroke="rgba(255,255,255,.6)" stroke-width="2"/><line x1="16" y1="8" x2="24" y2="22" stroke="rgba(255,255,255,.6)" stroke-width="2"/><circle cx="16" cy="8" r="5" fill="#fff"/><circle cx="8" cy="23" r="4.5" fill="#7DF0D4"/><circle cx="24" cy="23" r="4.5" fill="#FFE29A"/></svg>
      Treezip
    </div>
    <div>
      <h1>Frequent letters get short codes.</h1>
      <p>Paste text, see the Huffman tree that compresses it, and download the result as a .huf file.</p>
      <figure class="demo">
        <svg viewBox="0 0 360 330" role="img" aria-label="Huffman tree for the word abracadabra: a is 0, c is 100, d is 101, b is 110, r is 111">
          <g>
            <line class="t-edge d1" x1="128" y1="40" x2="40" y2="120"/>
            <line class="t-edge d1" x1="128" y1="40" x2="215" y2="120"/>
            <line class="t-edge d2" x1="215" y1="120" x2="145" y2="200"/>
            <line class="t-edge d2" x1="215" y1="120" x2="285" y2="200"/>
            <line class="t-edge d3" x1="145" y1="200" x2="110" y2="280"/>
            <line class="t-edge d3" x1="145" y1="200" x2="180" y2="280"/>
            <line class="t-edge d3" x1="285" y1="200" x2="250" y2="280"/>
            <line class="t-edge d3" x1="285" y1="200" x2="320" y2="280"/>
          </g>
          <g>
            <text class="e0 t-node d1" x="72" y="74">0</text><text class="e1 t-node d1" x="184" y="74">1</text>
            <text class="e0 t-node d2" x="165" y="154">0</text><text class="e1 t-node d2" x="256" y="154">1</text>
            <text class="e0 t-node d3" x="116" y="244">0</text><text class="e1 t-node d3" x="170" y="244">1</text>
            <text class="e0 t-node d3" x="256" y="244">0</text><text class="e1 t-node d3" x="310" y="244">1</text>
          </g>
          <g class="t-node d0"><circle class="t-int" cx="128" cy="40" r="22"/><text class="t-txt" x="128" y="45" font-size="14">11</text></g>
          <g class="t-node d1"><circle class="t-leaf" cx="40" cy="120" r="22"/><text class="t-txt" x="40" y="119" font-size="15">a</text><text class="t-txt" x="40" y="133" font-size="10" fill="#cfeee4">5</text><text class="t-code" x="40" y="160" fill="#3DD6AE">0</text></g>
          <g class="t-node d1"><circle class="t-int" cx="215" cy="120" r="22"/><text class="t-txt" x="215" y="125" font-size="14">6</text></g>
          <g class="t-node d2"><circle class="t-int" cx="145" cy="200" r="22"/><text class="t-txt" x="145" y="205" font-size="14">2</text></g>
          <g class="t-node d2"><circle class="t-int" cx="285" cy="200" r="22"/><text class="t-txt" x="285" y="205" font-size="14">4</text></g>
          <g class="t-node d3"><circle class="t-leaf" cx="110" cy="280" r="22"/><text class="t-txt" x="110" y="279" font-size="15">c</text><text class="t-txt" x="110" y="293" font-size="10" fill="#cfeee4">1</text><text class="t-code" x="110" y="320" fill="#3DD6AE">100</text></g>
          <g class="t-node d3"><circle class="t-leaf" cx="180" cy="280" r="22"/><text class="t-txt" x="180" y="279" font-size="15">d</text><text class="t-txt" x="180" y="293" font-size="10" fill="#cfeee4">1</text><text class="t-code" x="180" y="320" fill="#3DD6AE">101</text></g>
          <g class="t-node d3"><circle class="t-leaf" cx="250" cy="280" r="22"/><text class="t-txt" x="250" y="279" font-size="15">b</text><text class="t-txt" x="250" y="293" font-size="10" fill="#cfeee4">2</text><text class="t-code" x="250" y="320" fill="#3DD6AE">110</text></g>
          <g class="t-node d3"><circle class="t-leaf" cx="320" cy="280" r="22"/><text class="t-txt" x="320" y="279" font-size="15">r</text><text class="t-txt" x="320" y="293" font-size="10" fill="#cfeee4">2</text><text class="t-code" x="320" y="320" fill="#3DD6AE">111</text></g>
        </svg>
        <figcaption>The word <b>abracadabra</b> takes 88 bits as plain text and 23 bits with these codes.</figcaption>
      </figure>
    </div>
  </section>

  <main class="side">
    <button type="button" class="theme" id="btnTheme" aria-label="Switch between light and dark theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <div class="panel">
      <h2 id="title">Log in</h2>
      <p class="sub" id="subtitle">Your compression history is saved to your account.</p>

      <div class="seg" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-mode="login">Log in</button>
        <button type="button" role="tab" aria-selected="false" data-mode="signup">Sign up</button>
      </div>

      <div id="error" class="error" role="alert"></div>

      <form id="form" autocomplete="on">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="20" autofocus>
        <div class="hint hidden" id="userHint">3 to 20 letters, digits or underscores.</div>

        <label for="password">Password</label>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
          <button type="button" id="toggle" aria-label="Show password">Show</button>
        </div>
        <div class="hint hidden" id="pwHint">At least 6 characters.</div>

        <div id="confirmWrap" class="hidden">
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" autocomplete="new-password">
        </div>

        <button class="submit" id="submit" type="submit">Log in</button>
      </form>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const root = document.documentElement;
let mode = "login";

$("btnTheme").onclick = () => {
  const t = root.dataset.theme === "dark" ? "light" : "dark";
  root.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch {}
};

function showError(msg) { const e = $("error"); e.textContent = msg; e.style.display = msg ? "block" : "none"; }

function setMode(m) {
  mode = m;
  const signup = m === "signup";
  document.querySelectorAll(".seg button").forEach(t => t.setAttribute("aria-selected", String(t.dataset.mode === m)));
  $("confirmWrap").classList.toggle("hidden", !signup);
  $("userHint").classList.toggle("hidden", !signup);
  $("pwHint").classList.toggle("hidden", !signup);
  $("confirm").required = signup;
  $("password").autocomplete = signup ? "new-password" : "current-password";
  $("title").textContent = signup ? "Create an account" : "Log in";
  $("subtitle").textContent = signup ? "Pick a username and password to start saving your results." : "Your compression history is saved to your account.";
  $("submit").textContent = signup ? "Create account" : "Log in";
  showError("");
}
document.querySelectorAll(".seg button").forEach(t => t.onclick = () => setMode(t.dataset.mode));
if (location.pathname === "/signup") setMode("signup");

$("toggle").onclick = () => {
  const show = $("password").type === "password";
  $("password").type = show ? "text" : "password";
  $("toggle").textContent = show ? "Hide" : "Show";
  $("toggle").setAttribute("aria-label", show ? "Hide password" : "Show password");
};

$("form").onsubmit = async e => {
  e.preventDefault();
  showError("");
  const username = $("username").value.trim();
  const password = $("password").value;
  if (mode === "signup") {
    if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) return showError("Username must be 3 to 20 letters, digits or underscores.");
    if (password.length < 6) return showError("Password must be at least 6 characters.");
    if (password !== $("confirm").value) return showError("Passwords do not match.");
  }
  $("submit").disabled = true;
  try {
    const res = await fetch("/api/" + mode, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username, password})
    });
    const data = await res.json().catch(() => ({error: "Bad server response."}));
    if (!res.ok) throw new Error(data.error || "Request failed.");
    location.href = "/";
  } catch (err) {
    showError(err.message === "Failed to fetch" ? "Cannot reach the server. Check that the Java server is running." : err.message);
  } finally {
    $("submit").disabled = false;
  }
};
</script>
</body>
</html>
